services:
  codexui:
    build:
      context: .
      args:
        CODEX_VERSION: "0.147.0"
    image: codexui:1.0.0
    container_name: codexui
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      HOME: /home/user
      CODEX_HOME: /home/user/.codex
      DATA_DIR: /app/data
      WEB_DIST: /app/web/dist
      WORKSPACE_ROOTS: /home/user/code:/home/user/server
      ALLOWED_ORIGIN: https://example.com
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3090:3000"
    volumes:
      - codexui-data:/app/data
      - /home/user/.codex:/home/user/.codex
      - /home/user/code:/home/user/code
      - /home/user/server:/home/user/server
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    stop_grace_period: 20s

volumes:
  codexui-data:
    name: codexui-data
