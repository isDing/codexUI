services:
  codexui:
    build:
      context: .
      args:
        CODEX_VERSION: "0.150.1"
        OPENCODE_VERSION: "1.18.29"
    image: codexui:latest
    container_name: codexui
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      HOME: ${HOME_DIR:-/home/user}
      CODEX_HOME: ${HOME_DIR:-/home/user}/.codex
      DATA_DIR: /app/data
      WEB_DIST: /app/web/dist
      WORKSPACE_ROOTS: ${CODE_DIR:-/home/user/code}:${SERVER_DIR:-/home/user/server}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-"true"}
      TRUST_PROXY: ${TRUST_PROXY:-"false"}
      OPENCODE_ENABLED: ${OPENCODE_ENABLED:-"false"}
      XDG_STATE_HOME: ${HOME_DIR:-/home/user}/.local/state
      XDG_CACHE_HOME: ${HOME_DIR:-/home/user}/.cache
    ports:
      - "127.0.0.1:${PORT_MAP:-3090}:3000"
    volumes:
      - codexui-data:/app/data
      - ${HOME_DIR:-/home/user}/.codex:${HOME_DIR:-/home/user}/.codex
      - ${HOME_DIR:-/home/user}/.local/share/opencode:${HOME_DIR:-/home/user}/.local/share/opencode
      - ${HOME_DIR:-/home/user}/.local/state/opencode:${HOME_DIR:-/home/user}/.local/state/opencode
      - ${HOME_DIR:-/home/user}/.config/opencode:${HOME_DIR:-/home/user}/.config/opencode
      - ${HOME_DIR:-/home/user}/.cache/opencode:${HOME_DIR:-/home/user}/.cache/opencode
      - ${CODE_DIR:-/home/user/code}:${CODE_DIR:-/home/user/code}
      - ${SERVER_DIR:-/home/user/server}:${SERVER_DIR:-/home/user/server}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    stop_grace_period: 20s

volumes:
  codexui-data:
    name: codexui-data
